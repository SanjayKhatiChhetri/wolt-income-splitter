<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#cc785c">
    <link rel="icon" href="app-icon.svg" type="image/svg+xml">
    <title>Reset Password – Wolt Income Splitter</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #faf9f5;
            color: #3d3d3a;
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background: #fff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(20,20,19,0.08);
        }

        h2 {
            margin-top: 0;
            color: #141413;
            font-family: "Cormorant Garamond", "Times New Roman", serif;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.92em;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6dfd8;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #cc785c;
        }

        .input-group {
            margin-bottom: 15px;
        }

        button {
            background: #cc785c;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #a9583e;
        }

        .status {
            margin-top: 12px;
            font-weight: 700;
            text-align: center;
        }

        .status.error {
            color: #c64545;
        }

        .status.success {
            color: #5db872;
        }

        .status.info {
            color: #6c6a64;
        }

        .hidden {
            display: none;
        }

        .muted {
            color: #6c6a64;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #cc785c;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card" id="resetCard">
        <h2>Set New Password</h2>
        <p class="muted">Enter your new password below.</p>
        <div class="input-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
        </div>
        <button type="button" onclick="updatePassword()">Update Password</button>
        <p id="resetStatus" class="status info hidden"></p>
        <a href="index.html" class="back-link">Back to Login</a>
    </div>

    <div class="card hidden" id="successCard">
        <h2>Password Updated!</h2>
        <p class="muted">Your password has been changed successfully. You can now log in with your new password.</p>
        <a href="index.html" class="back-link" style="font-size: 1em; font-weight: 600;">Go to Login</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://cuutpjofkllrmdeilgja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dXRwam9ma2xscm1kZWlsZ2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NDg4ODMsImV4cCI6MjA5MTIyNDg4M30.jskWv0hnsnjTIn6682q9CULdmJ5-a3jMEIBMGhKq9nQ';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function setStatus(message, type = 'info') {
            const el = document.getElementById('resetStatus');
            el.innerText = message;
            el.className = `status ${type}`;
            el.classList.remove('hidden');
        }

        async function updatePassword() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!password || !confirm) {
                setStatus('Please fill in both fields.', 'error');
                return;
            }

            if (password.length < 6) {
                setStatus('Password must be at least 6 characters.', 'error');
                return;
            }

            if (password !== confirm) {
                setStatus('Passwords do not match.', 'error');
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({ password });
            if (error) {
                setStatus(error.message, 'error');
                return;
            }

            document.getElementById('resetCard').classList.add('hidden');
            document.getElementById('successCard').classList.remove('hidden');
        }

        document.getElementById('confirmPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') updatePassword();
        });
    </script>
</body>

</html>
