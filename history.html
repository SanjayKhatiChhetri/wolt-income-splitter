<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wolt Analytics & History</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f8;
            color: #1a202c;
            max-width: 900px;
            margin: 0 auto;
            padding: 15px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: #00c2e8;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #6366f1;
            text-decoration: none;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.85em;
        }

        th,
        td {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 6px;
            text-align: right;
        }

        th {
            color: #64748b;
            font-weight: 600;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }

        td:nth-child(2),
        th:nth-child(2) {
            text-align: left;
            color: #6366f1;
            font-weight: bold;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #00c2e8;
            margin-top: 5px;
        }

        .error {
            color: #ef4444;
            font-weight: bold;
            text-align: center;
        }

        .info {
            color: #64748b;
            text-align: center;
        }

        .action-cell {
            white-space: nowrap;
        }

        .action-btn {
            width: auto;
            margin: 0 0 0 6px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8em;
            font-weight: 700;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .action-edit {
            background: #6366f1;
        }

        .action-delete {
            background: #ef4444;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-card {
            width: min(100%, 520px);
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.28);
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .modal-field {
            margin-bottom: 12px;
        }

        .modal-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .modal-field input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-actions button {
            margin-bottom: 0;
        }

        .btn-secondary {
            background: #64748b;
        }

        .btn-success {
            background: #10b981;
        }

        @media (max-width: 640px) {
            .modal-grid {
                grid-template-columns: 1fr;
            }

            .action-cell {
                min-width: 145px;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="nav-link">← Back to Calculator</a>

    <div class="card">
        <h2>Earnings Overview</h2>
        <div class="stat-grid">
            <div class="stat-box">
                <div>Total Gross Ever</div>
                <div class="stat-value" id="stat-gross">€0</div>
            </div>
            <div class="stat-box">
                <div>Total Owner Cut</div>
                <div class="stat-value" id="stat-owner" style="color: #10b981;">€0</div>
            </div>
        </div>
        <canvas id="earningsChart" width="400" height="200"></canvas>
    </div>

    <div class="card" style="overflow-x: auto;">
        <h2>History List</h2>
        <p id="loadingText" style="text-align: center; color: #64748b;">Loading data securely...</p>
        <p id="statusText" class="info" style="display: none;"></p>
        <table id="historyTable" style="display: none;">
            <thead>
                <tr>
                    <th>Saved On</th>
                    <th>Work Period</th>
                    <th>Gross</th>
                    <th>Expenses</th>
                    <th>Owner Cut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="modal-backdrop" id="editModal">
        <div class="modal-card">
            <h2 style="font-size: 1.25em; margin-bottom: 16px;">Modify History Entry</h2>
            <div class="modal-field">
                <label for="editWorkPeriod">Work Period</label>
                <input type="text" id="editWorkPeriod" placeholder="Apr 1, 2026 to Apr 15, 2026">
            </div>
            <div class="modal-grid">
                <div class="modal-field">
                    <label for="editTotalGross">Gross (€)</label>
                    <input type="number" id="editTotalGross" step="0.01">
                </div>
                <div class="modal-field">
                    <label for="editExpenses">Expenses (€)</label>
                    <input type="number" id="editExpenses" step="0.01">
                </div>
                <div class="modal-field">
                    <label for="editOwnerCut">Owner Cut (€)</label>
                    <input type="number" id="editOwnerCut" step="0.01">
                </div>
                <div class="modal-field">
                    <label for="editCreatedAt">Saved On</label>
                    <input type="datetime-local" id="editCreatedAt">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" type="button" onclick="closeEditModal()">Cancel</button>
                <button class="btn-success" type="button" onclick="saveEditedEntry()">Save Changes</button>
            </div>
            <p id="editStatus" class="info" style="margin-top: 12px; display: none;"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cuutpjofkllrmdeilgja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dXRwam9ma2xscm1kZWlsZ2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NDg4ODMsImV4cCI6MjA5MTIyNDg4M30.jskWv0hnsnjTIn6682q9CULdmJ5-a3jMEIBMGhKq9nQ';
        const APP_PIN_STORAGE_KEY = 'woltSplitterPin';
        const APP_HISTORY_STORAGE_KEY = 'woltSplitterHistory';
        const storedPin = localStorage.getItem(APP_PIN_STORAGE_KEY);
        const userPin = storedPin || prompt("Enter your secret database PIN to view history:");

        let earningsChart = null;
        let currentHistoryData = [];
        let currentDataSource = 'local';
        let editingIndex = null;

        if (userPin) {
            localStorage.setItem(APP_PIN_STORAGE_KEY, userPin);
        }

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            global: { headers: { 'x-app-pin': userPin } }
        });

        function getLocalHistory() {
            try {
                const raw = localStorage.getItem(APP_HISTORY_STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.error('Failed to read local history:', error);
                return [];
            }
        }

        function setLocalHistory(entries) {
            localStorage.setItem(APP_HISTORY_STORAGE_KEY, JSON.stringify(entries));
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDateTimeLocal(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function showStatus(message, isError = false) {
            const statusText = document.getElementById('statusText');
            statusText.innerText = message;
            statusText.style.display = 'block';
            statusText.style.color = isError ? '#ef4444' : '#64748b';
        }

        function showEditStatus(message, isError = false) {
            const editStatus = document.getElementById('editStatus');
            editStatus.innerText = message;
            editStatus.style.display = 'block';
            editStatus.style.color = isError ? '#ef4444' : '#64748b';
        }

        function showNoData(message) {
            document.getElementById('loadingText').innerHTML = message;
            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('historyTable').style.display = 'none';
        }

        async function loadData() {
            const localHistory = getLocalHistory();
            let data = [];

            if (userPin) {
                const response = await supabaseClient
                    .from('wolt_splits')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!response.error && Array.isArray(response.data) && response.data.length > 0) {
                    data = response.data;
                    currentDataSource = 'remote';
                } else if (localHistory.length > 0) {
                    data = localHistory;
                    currentDataSource = 'local';
                    showStatus('Loaded local history because the database could not be reached.');
                } else if (response.error) {
                    showNoData('<span class="error">Could not load history from the database.</span>');
                    showStatus(response.error.message || 'Unknown database error.', true);
                    return;
                }
            } else if (localHistory.length > 0) {
                data = localHistory;
                currentDataSource = 'local';
                showStatus('Loaded local history. Enter the PIN on the calculator page first if you want database sync.');
            } else {
                showNoData('<span class="error">PIN required.</span>');
                return;
            }

            if (data.length === 0) {
                showNoData('No history found.');
                return;
            }

            currentHistoryData = [...data];
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('historyTable').style.display = 'table';
            renderDashboard(currentHistoryData);
        }

        function renderDashboard(data) {
            let totalGrossEver = 0;
            let totalOwnerEver = 0;
            const dates = [];
            const grossData = [];
            const ownerData = [];
            const tbody = document.querySelector('#historyTable tbody');

            tbody.innerHTML = '';

            [...data].reverse().forEach(row => {
                const dateObj = new Date(row.created_at);
                dates.push(dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
                grossData.push(Number(row.total_gross) || 0);
                ownerData.push(Number(row.owner_cut) || 0);
            });

            data.forEach((row, index) => {
                totalGrossEver += Number(row.total_gross) || 0;
                totalOwnerEver += Number(row.owner_cut) || 0;
                const dateStr = new Date(row.created_at).toLocaleDateString();
                const period = row.work_period || 'N/A';

                tbody.innerHTML += `
                    <tr>
                        <td>${escapeHtml(dateStr)}</td>
                        <td>${escapeHtml(period)}</td>
                        <td>€${(Number(row.total_gross) || 0).toFixed(2)}</td>
                        <td>€${(Number(row.expenses) || 0).toFixed(2)}</td>
                        <td style="font-weight: bold; color: #10b981;">€${(Number(row.owner_cut) || 0).toFixed(2)}</td>
                        <td class="action-cell">
                            <button class="action-btn action-edit" onclick="openEditModal(${index})">Modify</button>
                            <button class="action-btn action-delete" onclick="deleteHistoryEntry(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stat-gross').innerText = `€${totalGrossEver.toFixed(2)}`;
            document.getElementById('stat-owner').innerText = `€${totalOwnerEver.toFixed(2)}`;

            const ctx = document.getElementById('earningsChart').getContext('2d');
            if (earningsChart) {
                earningsChart.destroy();
            }

            earningsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [
                        { label: 'Total Gross (€)', data: grossData, borderColor: '#00c2e8', tension: 0.3, fill: false },
                        { label: 'Owner Cut (€)', data: ownerData, borderColor: '#10b981', tension: 0.3, fill: false }
                    ]
                },
                options: { responsive: true }
            });
        }

        function openEditModal(index) {
            const entry = currentHistoryData[index];
            if (!entry) return;

            editingIndex = index;
            document.getElementById('editWorkPeriod').value = entry.work_period || '';
            document.getElementById('editTotalGross').value = Number(entry.total_gross || 0);
            document.getElementById('editExpenses').value = Number(entry.expenses || 0);
            document.getElementById('editOwnerCut').value = Number(entry.owner_cut || 0);
            document.getElementById('editCreatedAt').value = formatDateTimeLocal(entry.created_at || new Date().toISOString());
            document.getElementById('editStatus').style.display = 'none';
            document.getElementById('editModal').classList.add('open');
        }

        function closeEditModal() {
            editingIndex = null;
            document.getElementById('editModal').classList.remove('open');
            document.getElementById('editStatus').style.display = 'none';
        }

        function getRemoteRowFilter(entry) {
            if (entry.id !== undefined && entry.id !== null) {
                return { column: 'id', value: entry.id };
            }
            return null;
        }

        async function saveEditedEntry() {
            if (editingIndex === null) return;

            const savedOn = document.getElementById('editCreatedAt').value;
            if (!savedOn) {
                showEditStatus('Please choose the saved date/time.', true);
                return;
            }

            const updatedEntry = {
                ...currentHistoryData[editingIndex],
                work_period: document.getElementById('editWorkPeriod').value.trim() || 'N/A',
                total_gross: parseFloat(document.getElementById('editTotalGross').value) || 0,
                expenses: parseFloat(document.getElementById('editExpenses').value) || 0,
                owner_cut: parseFloat(document.getElementById('editOwnerCut').value) || 0,
                created_at: new Date(savedOn).toISOString()
            };

            if (updatedEntry.total_gross <= 0) {
                showEditStatus('Gross must be greater than 0.', true);
                return;
            }

            if (currentDataSource === 'remote') {
                const remoteFilter = getRemoteRowFilter(updatedEntry);
                if (!remoteFilter) {
                    showEditStatus('This row cannot be modified because no database id was found.', true);
                    return;
                }

                const payload = {
                    work_period: updatedEntry.work_period,
                    total_gross: updatedEntry.total_gross,
                    expenses: updatedEntry.expenses,
                    owner_cut: updatedEntry.owner_cut,
                    created_at: updatedEntry.created_at
                };

                const { error } = await supabaseClient
                    .from('wolt_splits')
                    .update(payload)
                    .eq(remoteFilter.column, remoteFilter.value);

                if (error) {
                    showEditStatus(error.message || 'Failed to update this history entry.', true);
                    return;
                }
            }

            currentHistoryData[editingIndex] = updatedEntry;
            setLocalHistory(currentHistoryData);
            renderDashboard(currentHistoryData);
            showStatus('History entry updated successfully.');
            closeEditModal();
        }

        async function deleteHistoryEntry(index) {
            const entry = currentHistoryData[index];
            if (!entry) return;

            const confirmed = confirm(`Delete the history entry for "${entry.work_period || 'this period'}"?`);
            if (!confirmed) return;

            if (currentDataSource === 'remote') {
                const remoteFilter = getRemoteRowFilter(entry);
                if (!remoteFilter) {
                    showStatus('This row cannot be deleted because no database id was found.', true);
                    return;
                }

                const { error } = await supabaseClient
                    .from('wolt_splits')
                    .delete()
                    .eq(remoteFilter.column, remoteFilter.value);

                if (error) {
                    showStatus(error.message || 'Failed to delete this history entry.', true);
                    return;
                }
            }

            currentHistoryData.splice(index, 1);
            setLocalHistory(currentHistoryData);

            if (currentHistoryData.length === 0) {
                document.getElementById('stat-gross').innerText = '€0';
                document.getElementById('stat-owner').innerText = '€0';
                if (earningsChart) {
                    earningsChart.destroy();
                    earningsChart = null;
                }
                showNoData('No history found.');
                showStatus('History entry deleted.');
                return;
            }

            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('historyTable').style.display = 'table';
            renderDashboard(currentHistoryData);
            showStatus('History entry deleted.');
        }

        window.onload = loadData;
    </script>
</body>

</html>
