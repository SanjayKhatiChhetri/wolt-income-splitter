<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#cc785c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="app-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="app-icon.svg">
    <title>Wolt History</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #faf9f5;
            color: #3d3d3a;
            max-width: 980px;
            margin: 0 auto;
            padding: 15px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(20,20,19,0.08);
            margin-bottom: 20px;
        }

        h1,
        h2 {
            margin-top: 0;
            color: #141413;
            font-family: "Cormorant Garamond", "Times New Roman", serif;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .muted {
            color: #6c6a64;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-link,
        button {
            background: #cc785c;
            color: #fff;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .nav-link:hover,
        button:hover {
            background: #a9583e;
        }

        .btn-secondary {
            background: #3d3d3a;
        }

        .btn-secondary:hover {
            background: #252523;
        }

        .btn-success {
            background: #5db872;
        }

        .btn-success:hover {
            background: #4a9d5f;
        }

        .hidden {
            display: none;
        }

        .auth-grid,
        .modal-grid,
        .stat-grid {
            display: grid;
            gap: 12px;
        }

        .auth-grid,
        .modal-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stat-grid {
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f5f0e8;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e6dfd8;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: 700;
            color: #cc785c;
            margin-top: 5px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.92em;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"],
        input[type="number"],
        input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #e6dfd8;
            border-radius: 8px;
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.88em;
        }

        th,
        td {
            border-bottom: 1px solid #e6dfd8;
            padding: 12px 6px;
            text-align: right;
        }

        th {
            color: #6c6a64;
            font-weight: 600;
        }

        td:first-child,
        th:first-child {
            text-align: left;
        }

        td:nth-child(2),
        th:nth-child(2) {
            text-align: left;
            color: #cc785c;
            font-weight: 700;
        }

        .status {
            margin-top: 12px;
            font-weight: 700;
            text-align: center;
        }

        .status.error {
            color: #c64545;
        }

        .status.success {
            color: #5db872;
        }

        .status.info {
            color: #6c6a64;
        }

        .action-cell {
            white-space: nowrap;
        }

        .action-btn {
            width: auto;
            margin: 0 0 0 6px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8em;
        }

        .action-edit {
            background: #cc785c;
        }

        .action-delete {
            background: #c64545;
        }

        .user-badge {
            padding: 10px 12px;
            background: #f5f0e8;
            border: 1px solid #e6dfd8;
            border-radius: 999px;
            color: #cc785c;
            font-weight: 700;
            font-size: 0.9em;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(20, 20, 19, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-card {
            width: min(100%, 520px);
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 25px 60px rgba(15, 23, 42, 0.28);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-actions button {
            margin-bottom: 0;
        }

        .worker-details {
            margin-top: 8px;
            padding: 10px;
            background: #f5f0e8;
            border: 1px solid #e6dfd8;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .worker-line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 0;
            color: #252523;
        }

        .period-cell {
            min-width: 220px;
        }

        @media (max-width: 700px) {
            .auth-grid,
            .modal-grid {
                grid-template-columns: 1fr;
            }

            .action-cell {
                min-width: 145px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="topbar">
            <div>
                <h1>History & Analytics</h1>
            </div>
            <div class="top-actions">
                <a href="index.html" class="nav-link">Back to Calculator</a>
                <div class="user-badge hidden" id="userBadge"></div>
                <button type="button" class="btn-secondary hidden" id="logoutBtn">Log Out</button>
            </div>
        </div>
    </div>

    <div class="card" id="authCard">
        <h2>Login</h2>
        <p class="muted">Sign in to view and manage your saved history.</p>
        <div class="auth-grid">
            <div>
                <label for="authEmail">Email</label>
                <input type="email" id="authEmail" placeholder="name@example.com" autocomplete="email">
            </div>
            <div>
                <label for="authPassword">Password</label>
                <input type="password" id="authPassword" placeholder="Your password" autocomplete="current-password">
            </div>
        </div>
        <div class="top-actions" style="margin-top: 12px;">
            <button type="button" onclick="loginUser()">Log In</button>
            <button type="button" class="btn-secondary" onclick="signUpUser()">Create Account</button>
        </div>
        <p style="margin-top: 10px; text-align: center;"><a href="#" onclick="forgotPassword(); return false;" style="color: #cc785c; font-size: 0.9em;">Forgot Password?</a></p>
        <p id="authStatus" class="status info hidden"></p>
    </div>

    <div id="historyShell" class="hidden">
        <div class="card">
            <h2>Earnings Overview</h2>
            <div class="stat-grid">
                <div class="stat-box">
                    <div>Total Gross Ever</div>
                    <div class="stat-value" id="stat-gross">€0</div>
                </div>
                <div class="stat-box">
                    <div>Total Owner Cut</div>
                    <div class="stat-value" id="stat-owner" style="color: #5db872;">€0</div>
                </div>
            </div>
            <canvas id="earningsChart" width="400" height="200"></canvas>
        </div>

        <div class="card" style="overflow-x: auto;">
            <h2>History List</h2>
            <p id="loadingText" class="muted" style="text-align: center;">Loading your data...</p>
            <p id="statusText" class="status info hidden"></p>
            <table id="historyTable" class="hidden">
                <thead>
                    <tr>
                        <th>Saved On</th>
                        <th>Work Period</th>
                    <th>Gross</th>
                    <th>Expenses</th>
                    <th>Owner Cut</th>
                    <th>Details</th>
                    <th>Actions</th>
                </tr>
            </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="modal-backdrop" id="editModal">
        <div class="modal-card">
            <h2 style="font-size: 1.25em; margin-bottom: 16px;">Modify History Entry</h2>
            <div>
                <label for="editWorkPeriod">Work Period</label>
                <input type="text" id="editWorkPeriod" placeholder="Apr 1, 2026 to Apr 15, 2026">
            </div>
            <div class="modal-grid" style="margin-top: 12px;">
                <div>
                    <label for="editTotalGross">Gross (€)</label>
                    <input type="number" id="editTotalGross" step="0.01">
                </div>
                <div>
                    <label for="editExpenses">Expenses (€)</label>
                    <input type="number" id="editExpenses" step="0.01">
                </div>
                <div>
                    <label for="editOwnerCut">Owner Cut (€)</label>
                    <input type="number" id="editOwnerCut" step="0.01">
                </div>
                <div>
                    <label for="editCreatedAt">Saved On</label>
                    <input type="datetime-local" id="editCreatedAt">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" type="button" onclick="closeEditModal()">Cancel</button>
                <button class="btn-success" type="button" onclick="saveEditedEntry()">Save Changes</button>
            </div>
            <p id="editStatus" class="status info hidden"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cuutpjofkllrmdeilgja.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dXRwam9ma2xscm1kZWlsZ2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NDg4ODMsImV4cCI6MjA5MTIyNDg4M30.jskWv0hnsnjTIn6682q9CULdmJ5-a3jMEIBMGhKq9nQ';
        const LOCAL_HISTORY_PREFIX = 'woltSplitterHistory';
        const APP_URL = 'https://wolt-income-spliter.netlify.app/';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentHistoryData = [];
        let earningsChart = null;
        let editingIndex = null;
        let currentDataSource = 'remote';

        function getLocalHistoryKey() {
            return currentUser ? `${LOCAL_HISTORY_PREFIX}:${currentUser.id}` : LOCAL_HISTORY_PREFIX;
        }

        function getLocalHistory() {
            try {
                const raw = localStorage.getItem(getLocalHistoryKey());
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.error('Failed to read local history:', error);
                return [];
            }
        }

        function setLocalHistory(history) {
            localStorage.setItem(getLocalHistoryKey(), JSON.stringify(history));
        }

        function setStatus(elementId, message, type = 'info') {
            const el = document.getElementById(elementId);
            el.innerText = message;
            el.className = `status ${type}`;
            el.classList.remove('hidden');
        }

        function clearStatus(elementId) {
            const el = document.getElementById(elementId);
            el.innerText = '';
            el.className = 'status info hidden';
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDateTimeLocal(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function showNoData(message) {
            document.getElementById('loadingText').innerHTML = message;
            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('historyTable').classList.add('hidden');
        }

        function renderWorkerDetails(row) {
            const workers = Array.isArray(row.workers_data) ? row.workers_data : [];
            const ownerName = row.owner_name || 'Owner';
            const workerLines = workers.map(worker => `
                <div class="worker-line">
                    <span>${escapeHtml(worker.name || 'Unknown')}</span>
                    <span>€${(Number(worker.final_share) || 0).toFixed(2)}</span>
                </div>
            `).join('');

            return `
                <div class="worker-details">
                    <div class="worker-line">
                        <strong>${escapeHtml(ownerName)}</strong>
                        <strong>€${(Number(row.owner_cut) || 0).toFixed(2)}</strong>
                    </div>
                    ${workerLines || '<div class="worker-line"><span>No worker details</span><span>-</span></div>'}
                </div>
            `;
        }

        function renderDashboard(data) {
            const tbody = document.querySelector('#historyTable tbody');
            const labels = [];
            const grossData = [];
            const ownerData = [];
            let totalGrossEver = 0;
            let totalOwnerEver = 0;

            tbody.innerHTML = '';

            [...data].reverse().forEach(row => {
                const dateObj = new Date(row.created_at);
                labels.push(dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
                grossData.push(Number(row.total_gross) || 0);
                ownerData.push(Number(row.owner_cut) || 0);
            });

            data.forEach((row, index) => {
                totalGrossEver += Number(row.total_gross) || 0;
                totalOwnerEver += Number(row.owner_cut) || 0;
                tbody.innerHTML += `
                    <tr>
                        <td>${escapeHtml(new Date(row.created_at).toLocaleDateString())}</td>
                        <td class="period-cell">${escapeHtml(row.work_period || 'N/A')}</td>
                        <td>€${(Number(row.total_gross) || 0).toFixed(2)}</td>
                        <td>€${(Number(row.expenses) || 0).toFixed(2)}</td>
                        <td style="font-weight: 700; color: #5db872;">€${(Number(row.owner_cut) || 0).toFixed(2)}</td>
                        <td>${renderWorkerDetails(row)}</td>
                        <td class="action-cell">
                            <button class="action-btn action-edit" type="button" onclick="openEditModal(${index})">Modify</button>
                            <button class="action-btn action-delete" type="button" onclick="deleteHistoryEntry(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stat-gross').innerText = `€${totalGrossEver.toFixed(2)}`;
            document.getElementById('stat-owner').innerText = `€${totalOwnerEver.toFixed(2)}`;
            document.getElementById('loadingText').style.display = 'none';
            document.getElementById('historyTable').classList.remove('hidden');

            const ctx = document.getElementById('earningsChart').getContext('2d');
            if (earningsChart) earningsChart.destroy();
            earningsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Total Gross (€)',
                            data: grossData,
                            borderColor: '#cc785c',
                            backgroundColor: '#cc785c',
                            tension: 0,
                            fill: false,
                            pointRadius: 4,
                            pointBackgroundColor: '#cc785c',
                            borderWidth: 2
                        },
                        {
                            label: 'Owner Cut (€)',
                            data: ownerData,
                            borderColor: '#5db8a6',
                            backgroundColor: '#5db8a6',
                            tension: 0,
                            fill: false,
                            pointRadius: 4,
                            pointBackgroundColor: '#5db8a6',
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { family: 'Inter, sans-serif', size: 13 },
                                color: '#3d3d3a',
                                usePointStyle: true,
                                pointStyle: 'circle',
                                padding: 20
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: {
                                font: { family: 'Inter, sans-serif', size: 12 },
                                color: '#6c6a64'
                            },
                            border: { color: '#141413' }
                        },
                        y: {
                            grid: {
                                color: '#e6dfd8'
                            },
                            ticks: {
                                font: { family: 'Inter, sans-serif', size: 12 },
                                color: '#6c6a64'
                            },
                            border: { display: false }
                        }
                    }
                }
            });
        }

        async function loadData() {
            if (!currentUser) return;

            document.getElementById('loadingText').style.display = 'block';
            document.getElementById('loadingText').innerText = 'Loading your data...';
            clearStatus('statusText');

            const localHistory = getLocalHistory();
            const response = await supabaseClient
                .from('wolt_splits')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (!response.error) {
                currentHistoryData = Array.isArray(response.data) ? response.data : [];
                currentDataSource = 'remote';
                setLocalHistory(currentHistoryData);
            } else if (localHistory.length > 0) {
                currentHistoryData = localHistory;
                currentDataSource = 'local';
                setStatus('statusText', 'Loaded local history because the database could not be reached.', 'info');
            } else {
                currentHistoryData = [];
                currentDataSource = 'remote';
                setStatus('statusText', response.error.message, 'error');
            }

            if (currentHistoryData.length === 0) {
                document.getElementById('stat-gross').innerText = '€0';
                document.getElementById('stat-owner').innerText = '€0';
                if (earningsChart) {
                    earningsChart.destroy();
                    earningsChart = null;
                }
                showNoData('No history found yet.');
                return;
            }

            renderDashboard(currentHistoryData);
        }

        function openEditModal(index) {
            const entry = currentHistoryData[index];
            if (!entry) return;

            editingIndex = index;
            document.getElementById('editWorkPeriod').value = entry.work_period || '';
            document.getElementById('editTotalGross').value = Number(entry.total_gross || 0);
            document.getElementById('editExpenses').value = Number(entry.expenses || 0);
            document.getElementById('editOwnerCut').value = Number(entry.owner_cut || 0);
            document.getElementById('editCreatedAt').value = formatDateTimeLocal(entry.created_at || new Date().toISOString());
            clearStatus('editStatus');
            document.getElementById('editModal').classList.add('open');
        }

        function closeEditModal() {
            editingIndex = null;
            document.getElementById('editModal').classList.remove('open');
        }

        async function saveEditedEntry() {
            if (editingIndex === null) return;

            const savedOn = document.getElementById('editCreatedAt').value;
            if (!savedOn) {
                setStatus('editStatus', 'Please choose the saved date and time.', 'error');
                return;
            }

            const updatedEntry = {
                ...currentHistoryData[editingIndex],
                work_period: document.getElementById('editWorkPeriod').value.trim() || 'N/A',
                total_gross: parseFloat(document.getElementById('editTotalGross').value) || 0,
                expenses: parseFloat(document.getElementById('editExpenses').value) || 0,
                owner_cut: parseFloat(document.getElementById('editOwnerCut').value) || 0,
                created_at: new Date(savedOn).toISOString()
            };

            if (updatedEntry.total_gross <= 0) {
                setStatus('editStatus', 'Gross must be greater than 0.', 'error');
                return;
            }

            if (currentDataSource === 'remote' && updatedEntry.id) {
                const { error } = await supabaseClient
                    .from('wolt_splits')
                    .update({
                        work_period: updatedEntry.work_period,
                        total_gross: updatedEntry.total_gross,
                        expenses: updatedEntry.expenses,
                        owner_cut: updatedEntry.owner_cut,
                        created_at: updatedEntry.created_at
                    })
                    .eq('id', updatedEntry.id)
                    .eq('user_id', currentUser.id);

                if (error) {
                    setStatus('editStatus', error.message, 'error');
                    return;
                }
            }

            currentHistoryData[editingIndex] = updatedEntry;
            setLocalHistory(currentHistoryData);
            renderDashboard(currentHistoryData);
            closeEditModal();
            setStatus('statusText', 'History entry updated successfully.', 'success');
        }

        async function deleteHistoryEntry(index) {
            const entry = currentHistoryData[index];
            if (!entry) return;

            const confirmed = confirm(`Delete the history entry for "${entry.work_period || 'this period'}"?`);
            if (!confirmed) return;

            if (currentDataSource === 'remote' && entry.id) {
                const { error } = await supabaseClient
                    .from('wolt_splits')
                    .delete()
                    .eq('id', entry.id)
                    .eq('user_id', currentUser.id);

                if (error) {
                    setStatus('statusText', error.message, 'error');
                    return;
                }
            }

            currentHistoryData.splice(index, 1);
            setLocalHistory(currentHistoryData);

            if (currentHistoryData.length === 0) {
                document.getElementById('stat-gross').innerText = '€0';
                document.getElementById('stat-owner').innerText = '€0';
                if (earningsChart) {
                    earningsChart.destroy();
                    earningsChart = null;
                }
                showNoData('No history found yet.');
            } else {
                renderDashboard(currentHistoryData);
            }

            setStatus('statusText', 'History entry deleted.', 'success');
        }

        async function loginUser() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                setStatus('authStatus', 'Enter both email and password.', 'error');
                return;
            }

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                setStatus('authStatus', error.message, 'error');
                return;
            }

            clearStatus('authStatus');
        }

        async function signUpUser() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                setStatus('authStatus', 'Enter both email and password.', 'error');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    emailRedirectTo: APP_URL
                }
            });
            if (error) {
                setStatus('authStatus', error.message, 'error');
                return;
            }

            if (data.user && !data.session) {
                setStatus('authStatus', 'Account created. Check your email to confirm before logging in.', 'info');
            } else {
                setStatus('authStatus', 'Account created and logged in.', 'success');
            }
        }

        async function forgotPassword() {
            const email = document.getElementById('authEmail').value.trim();
            if (!email) {
                setStatus('authStatus', 'Enter your email address first.', 'error');
                return;
            }

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: APP_URL + 'reset-password.html'
            });
            if (error) {
                setStatus('authStatus', error.message, 'error');
                return;
            }

            setStatus('authStatus', 'Password reset link sent! Check your email.', 'success');
        }

        async function logoutUser() {
            await supabaseClient.auth.signOut();
        }

        function renderAuthState(user) {
            currentUser = user || null;

            const authCard = document.getElementById('authCard');
            const historyShell = document.getElementById('historyShell');
            const logoutBtn = document.getElementById('logoutBtn');
            const userBadge = document.getElementById('userBadge');

            if (currentUser) {
                authCard.classList.add('hidden');
                historyShell.classList.remove('hidden');
                logoutBtn.classList.remove('hidden');
                userBadge.classList.remove('hidden');
                userBadge.innerText = currentUser.email;
                loadData();
            } else {
                authCard.classList.remove('hidden');
                historyShell.classList.add('hidden');
                logoutBtn.classList.add('hidden');
                userBadge.classList.add('hidden');
            }
        }

        async function initializeAuth() {
            document.getElementById('logoutBtn').addEventListener('click', logoutUser);

            const { data } = await supabaseClient.auth.getSession();
            renderAuthState(data.session?.user || null);

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                renderAuthState(session?.user || null);
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(error => {
                    console.error('Service worker registration failed:', error);
                });
            });
        }

        initializeAuth();
    </script>
</body>

</html>
